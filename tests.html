<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onboarding logic tests</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 20px; }
      .pass { color: #1f8a4c; } .fail { color: #c4352b; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Onboarding logic tests</h1>
    <p id="summary"></p>
    <ul id="out"></ul>
    <script src="js/data.js"></script>
    <script src="js/plan.js"></script>
    <script src="js/newhire.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/hr.js"></script>
    <script src="js/hr2.js"></script>
    <script>
      const results = [];
      function test(name, fn) {
        try { fn(); results.push([name, true]); } catch (e) { results.push([name + " — " + e.message, false]); }
      }
      function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || "") + ` expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }
      function ok(v, msg) { if (!v) throw new Error(msg || "expected truthy"); }

      const T = "2026-11-05";
      function hire(dept, start, doneKeys) {
        const tasks = OB.buildPlan(dept, start);
        for (const t of tasks) if ((doneKeys || []).includes(t.key)) t.done = true;
        return { id: "x", name: "Test Person", department: dept, startDate: start, managerId: "david", tasks };
      }

      test("dates: addDays across month end", () => eq(OB.addDays("2026-10-30", 3), "2026-11-02"));
      test("dates: diffDays across DST change", () => eq(OB.diffDays("2026-11-02", "2026-10-31"), 2));
      test("dates: rejects 2026-02-30", () => eq(OB.isValidISO("2026-02-30"), false));

      test("phases from day offset", () => {
        eq(OB.phaseForOffset(-1), "before"); eq(OB.phaseForOffset(0), "week1"); eq(OB.phaseForOffset(6), "week1"); eq(OB.phaseForOffset(7), "month1");
      });

      test("Engineering plan = Company + Engineering tasks", () => {
        const p = OB.buildPlan("Engineering", T);
        // A department name alone = the default profile (Onsite, Individual contributor), so conditional tasks are filtered.
        const dflt = { department: "Engineering", workType: "Onsite", jobLevel: "Individual contributor" };
        eq(p.length, OB.TEMPLATES.Company.filter((t) => OB.taskApplies(t, dflt)).length + OB.TEMPLATES.Engineering.length);
        ok(p.some((t) => t.key === "e-devenv"), "has dev env task");
        ok(!p.some((t) => t.key === "s-demo"), "no sales tasks");
      });
      test("Sales plan has no engineering tasks", () => {
        const p = OB.buildPlan("Sales", T);
        ok(!p.some((t) => t.source === "Engineering"));
        ok(p.some((t) => t.key === "s-demo"));
      });
      test("due dates come from start date", () => {
        const p = OB.buildPlan("Engineering", "2026-11-09");
        eq(p.find((t) => t.key === "c-offer").dueDate, "2026-10-30");
        eq(p.find((t) => t.key === "c-orient").dueDate, "2026-11-09");
      });
      test("late plan: past due dates move to creation day, nothing overdue", () => {
        const start = OB.addDays(T, 1);
        const p = OB.buildPlan("Engineering", start, [], T);
        ok(p.every((t) => t.dueDate >= T));
        eq(p.find((t) => t.key === "c-orient").dueDate, start);
        eq(OB.hireStats({ startDate: start, tasks: p }, T).overdue.length, 0);
      });
      test("built plan keeps new-hire wording (hireTitle/hireDesc)", () => {
        const p = OB.buildPlan("Engineering", T);
        const t = p.find((x) => x.key === "c-1on1");
        eq(t.hireTitle, OB.TEMPLATES.Company.find((x) => x.key === "c-1on1").hireTitle);
        ok(t.hireTitle && t.hireDesc, "has hire wording");
        eq(p.find((x) => x.key === "c-offer").hireTitle, null);
        eq(p.find((x) => x.key === "e-access").hireTitle, OB.TEMPLATES.Engineering.find((x) => x.key === "e-access").hireTitle);
      });
      test("skipped template tasks are left out", () => {
        const p = OB.buildPlan("Engineering", T, ["e-oncall"]);
        ok(!p.some((t) => t.key === "e-oncall"));
      });

      test("focus: max 3 tasks, all owned by new hire", () => {
        const f = OB.focusTasks(hire("Engineering", OB.addDays(T, 4)), T, 3);
        ok(f.tasks.length <= 3); ok(f.tasks.every((t) => t.owner === "newhire"));
      });
      test("focus: before start, shows Before Day 1 tasks only", () => {
        const f = OB.focusTasks(hire("Engineering", OB.addDays(T, 4)), T, 3);
        ok(f.tasks.every((t) => t.phase === "before"), JSON.stringify(f.tasks.map((t) => t.phase)));
      });
      test("focus: overdue tasks come first", () => {
        const h = hire("Engineering", OB.addDays(T, -6), []);
        const f = OB.focusTasks(h, T, 3);
        ok(OB.isOverdue(f.tasks[0], T));
      });
      test("focus: nothing due now → shows upcoming", () => {
        const start = OB.addDays(T, 4);
        const h = hire("Engineering", start);
        h.tasks.forEach((t) => { if (t.phase === "before") t.done = true; });
        const f = OB.focusTasks(h, T, 3);
        eq(f.upcoming, true); ok(f.tasks.length > 0);
      });

      // D2: status says whose action is needed.
      const doneUnless = (h, owners) => { h.tasks.forEach((t) => { if (!owners.includes(t.owner)) t.done = true; }); return h; };
      test("status: manager's overdue task → action, counted in youOwe", () => {
        const s = OB.hireStats(hire("Sales", OB.addDays(T, -10)), T);
        eq(s.status, "action"); ok(s.youOwe > 0); ok(s.behind > 0);
        eq(s.youOwe + s.behind + s.waitingIt + s.waitingHr + s.overdue.filter((t) => t.owner === "newhire" && t.isEvent).length, s.overdue.length);
      });
      test("status: only the hire's own overdue → behind (meetings not counted)", () => {
        const h = doneUnless(hire("Engineering", OB.addDays(T, -6)), ["newhire"]);
        const s = OB.hireStats(h, T);
        eq(s.status, "behind"); eq(s.youOwe, 0);
        eq(s.behind, s.overdue.filter((t) => !t.isEvent).length);
        ok(s.overdue.some((t) => t.isEvent), "orientation is overdue for managers but not 'behind'");
      });
      test("status: before Day 1, the hire's lateness is only 'behind'", () => {
        const h = doneUnless(hire("Engineering", OB.addDays(T, 4)), ["newhire"]);
        const s = OB.hireStats(h, T);
        ok(s.dayN < 0); eq(s.status, "behind"); eq(s.behind, 3); eq(s.youOwe, 0);
      });
      test("status: only IT/HR overdue → waiting", () => {
        const h = doneUnless(hire("Engineering", OB.addDays(T, -6)), []);
        h.tasks.find((t) => t.key === "c-accounts").done = false;
        const s = OB.hireStats(h, T);
        eq(s.status, "waiting"); eq(s.waitingIt, 1); eq(s.waitingHr, 0);
        eq(s.waitingOn, { newhire: 0, manager: 0, it: 1, hr: 0 });
      });
      test("status: future start, nothing overdue → upcoming", () => eq(OB.hireStats(hire("Sales", OB.addDays(T, 30)), T).status, "upcoming"));
      test("status: started, nothing overdue → ontrack", () => {
        const h = hire("Sales", OB.addDays(T, -3));
        h.tasks.forEach((t) => { if (t.dueDate < T) t.done = true; });
        eq(OB.hireStats(h, T).status, "ontrack");
      });
      test("bar: counts the hire's own tasks (no meetings); tick = own tasks before today", () => {
        const h = hire("Engineering", OB.addDays(T, -6), ["c-offer", "c-benefits", "c-laptop"]);
        const o = OB.hireStats(h, T).own;
        const own = h.tasks.filter((t) => t.owner === "newhire" && !t.isEvent);
        eq(o.total, own.length);
        eq(o.expected, own.filter((t) => t.dueDate < T).length);
        eq(o.done, 2, "IT's laptop task isn't counted");
        eq(o.doneExpected, 1, "c-benefits is done early, so it isn't in the fill");
      });
      test("F11: '<N> to catch up' chip = the bar's gap (tick minus fill), for every seed-like case", () => {
        const cases = [
          hire("Engineering", OB.addDays(T, 4), ["c-offer", "c-tax", "c-laptop"]), // Emily-like
          hire("Engineering", OB.addDays(T, -6), ["c-offer", "c-tax", "c-deposit", "c-welcome", "c-laptop", "c-note", "c-orient", "c-badge", "e-devenv"]), // Marcus-like
          hire("Sales", OB.addDays(T, -12), []),
          hire("Marketing", OB.addDays(T, 10), []),
        ];
        cases.forEach((h, i) => {
          const s = OB.hireStats(h, T);
          eq(s.behind, s.own.expected - s.own.doneExpected, `case ${i}`);
          eq(s.behind, s.own.toCatchUp, `case ${i}`);
        });
        eq(OB.hireStats(cases[0], T).behind, 1);
        eq(OB.hireStats(cases[1], T).behind, 3);
      });
      test("F1: rolling week counts past-due items on today, list = strip, later kept apart", () => {
        const mk = (d) => ({ t: { dueDate: d } });
        const items = [mk(OB.addDays(T, -7)), mk(T), mk(OB.addDays(T, 1)), mk(OB.addDays(T, 3)), mk(OB.addDays(T, 6)), mk(OB.addDays(T, 7))];
        const w = OB.rollingWeek(items, T);
        eq(w.days.length, 7);
        eq(w.days[0].date, T); eq(w.days[6].date, OB.addDays(T, 6));
        eq(w.days.map((d) => d.items.length), [2, 1, 0, 1, 0, 0, 1]);
        eq(w.total, 5); eq(w.items.length, w.total);
        eq(w.days.reduce((n, d) => n + d.items.length, 0), w.total, "strip total = list length");
        eq(w.later.length, 1);
        eq(OB.rollingWeek([], T).total, 0);
      });
      test("status labels use neutral wording", () => {
        const bad = /overdue|late|owe|behind|missed|fail|attention/i;
        Object.values(OB.STATUS_LABEL).forEach((l) => ok(!bad.test(l), l));
      });
      test("week starts on Monday", () => {
        eq(OB.weekStart("2026-11-05"), "2026-11-02"); eq(OB.weekStart("2026-11-02"), "2026-11-02"); eq(OB.weekStart("2026-11-08"), "2026-11-02");
      });
      test("status: all done → complete", () => {
        const h = hire("Sales", OB.addDays(T, -3)); h.tasks.forEach((t) => (t.done = true));
        eq(OB.hireStats(h, T).status, "complete");
      });
      test("status: empty plan does not crash", () => {
        const h = hire("Sales", T); h.tasks = [];
        const s = OB.hireStats(h, T); eq(s.pct, 0); ok(s.status !== "complete");
      });

      test("permissions", () => {
        eq(OB.canComplete("newhire", { owner: "newhire" }), true);
        eq(OB.canComplete("newhire", { owner: "manager" }), false);
        eq(OB.canComplete("manager", { owner: "newhire" }), false);
        eq(OB.canComplete("hr", { owner: "it" }), true);
      });

      const good = { name: "Jo Bloggs", title: "Engineer", department: "Engineering", managerId: "david", startDate: OB.addDays(T, 14), workType: "Onsite", jobLevel: "Individual contributor" };
      test("validate: good input passes", () => eq(OB.validateHire(good, T, []).ok, true));
      test("validate: blank name fails", () => ok(OB.validateHire({ ...good, name: "   " }, T, []).errors.name));
      test("validate: missing department fails", () => ok(OB.validateHire({ ...good, department: "" }, T, []).errors.department));
      test("validate: start > 4 weeks ago fails", () => ok(OB.validateHire({ ...good, startDate: OB.addDays(T, -40) }, T, []).errors.startDate));
      test("validate: start in past warns", () => ok(OB.validateHire({ ...good, startDate: OB.addDays(T, -3) }, T, []).warnings.length));
      test("validate: duplicate name warns", () => ok(OB.validateHire(good, T, [{ name: "jo bloggs" }]).warnings.length));
      test("validate: work type and job level are required and must be from the lists", () => {
        ok(OB.validateHire({ ...good, workType: "" }, T, []).errors.workType);
        ok(OB.validateHire({ ...good, jobLevel: "CEO" }, T, []).errors.jobLevel);
        eq(OB.validateHire({ ...good, workType: "Remote", jobLevel: "Intern" }, T, []).ok, true);
      });
      test("validate: invalid date string fails", () => ok(OB.validateHire({ ...good, startDate: "2026-13-01" }, T, []).errors.startDate));

      test("custom task: needs title", () => ok(OB.validateCustomTask({ title: "", owner: "newhire", dueDate: T }, { startDate: T }).errors.title));
      test("custom task: beyond 4 weeks fails", () => ok(OB.validateCustomTask({ title: "x", owner: "newhire", dueDate: OB.addDays(T, 40) }, { startDate: T }).errors.dueDate));
      test("custom task: phase from due date", () => {
        const t = OB.makeCustomTask({ title: "x", owner: "manager", dueDate: OB.addDays(T, 10) }, { startDate: T }, "david");
        eq(t.phase, "month1"); eq(t.custom, true);
      });

      // ---- Round 2: calm reminders, journey, Day 1 ----
      test("isEvent is copied from templates into the plan", () => {
        const p = OB.buildPlan("Engineering", T);
        eq(p.find((t) => t.key === "c-orient").isEvent, true);
        eq(p.find((t) => t.key === "c-1on1").isEvent, true);
        eq(p.find((t) => t.key === "c-security").isEvent, false);
      });
      test("past-due event is pending, not one of the hire's own late tasks", () => {
        const h = hire("Engineering", OB.addDays(T, -1));
        const orient = h.tasks.find((t) => t.key === "c-orient");
        eq(OB.isEventPending(orient, T), true);
        ok(!OB.ownLate(h, T).some((t) => t.key === "c-orient"));
        ok(OB.isOverdue(orient, T), "managers still see it as overdue");
        orient.done = true;
        eq(OB.isEventPending(orient, T), false);
      });
      test("countdown wording", () => {
        eq(OB.countdownLabel(T, T), "Due today");
        eq(OB.countdownLabel(OB.addDays(T, 1), T), "Due tomorrow");
        eq(OB.countdownLabel(OB.addDays(T, 6), T), "Due in 6 days");
        ok(!/in \d+ days/.test(OB.countdownLabel(OB.addDays(T, 7), T)), "a week out shows the date");
      });
      test("phase progress counts only the hire's own tasks", () => {
        const h = hire("Engineering", OB.addDays(T, 4), ["c-offer", "c-tax", "c-laptop"]);
        const p = OB.myPhaseProgress(h, T);
        eq(p.phase, "before"); eq(p.label, "Before Day 1");
        eq(p.total, h.tasks.filter((t) => t.owner === "newhire" && t.phase === "before").length);
        eq(p.done, 2);
      });
      test("journey: segments 7/7/21 days, today marker before start", () => {
        const j = OB.journeyModel(OB.addDays(T, 4), T);
        eq(j.segments.map((s) => Math.round(s.width * 35)), [7, 7, 21]);
        eq(j.segments.map((s) => s.state), ["current", "future", "future"]);
        eq(j.pill, "Today · 4 days to go");
        ok(j.todayFrac > 0 && j.todayFrac < 0.2);
      });
      test("journey: Day 2 marks Before Day 1 as past", () => {
        const j = OB.journeyModel(OB.addDays(T, -1), T);
        eq(j.pill, "Day 2");
        eq(j.segments.map((s) => s.state), ["past", "current", "future"]);
        eq(j.segments.map((s) => s.finished), [true, false, false]);
        ok(!("fill" in j.segments[0]), "no date-proportional fill");
      });
      test("journey: a phase is finished early when all the hire's own tasks in it are done", () => {
        const h = hire("Engineering", OB.addDays(T, 4), ["c-offer", "c-tax", "c-deposit", "c-welcome"]);
        const done = OB.ownPhasesDone(h);
        eq(done.before, true); eq(done.week1, false);
        eq(OB.journeyModel(h.startDate, T, done).segments.map((s) => s.finished), [true, false, false]);
        eq(OB.journeyModel(h.startDate, T).segments.map((s) => s.finished), [false, false, false]);
      });
      test("ics: VEVENT with floating DTSTART and CRLF line endings", () => {
        const ics = OB.buildIcs({ uid: "x@y", date: "2026-11-09", start: "09:30", end: "13:30", summary: "First day", location: "Front desk, 2nd floor", description: "Hi; bring ID", stamp: "20261105T120000Z" });
        ok(ics.includes("BEGIN:VEVENT\r\n"), "has VEVENT");
        ok(ics.includes("\r\nDTSTART:20261109T093000\r\n"), "DTSTART floating local");
        ok(ics.includes("\r\nDTEND:20261109T133000\r\n"), "DTEND");
        ok(ics.includes("LOCATION:Front desk\\, 2nd floor"), "escapes commas");
        ok(ics.startsWith("BEGIN:VCALENDAR\r\n") && ics.endsWith("END:VCALENDAR\r\n"));
        ok(!/[^\r]\n/.test(ics), "every newline is CRLF");
      });
      test("Day 1 logistics: company default plus department override", () => {
        eq(OB.day1For("Engineering").time, "09:30");
        eq(OB.day1For("Engineering").place, OB.DAY1.place);
        eq(OB.day1For("Customer Support").time, "08:30");
        eq(OB.fmtTime("09:30"), "9:30am"); eq(OB.fmtTime("13:05"), "1:05pm");
      });
      test("banner: Day-1 reminder outranks overdue, 3 days out", () => {
        const h = hire("Engineering", OB.addDays(T, 3));
        eq(OB.pickBanner(h, T, {}).kind, "day1");
        eq(OB.pickBanner(hire("Engineering", OB.addDays(T, 5)), T, {}).kind, "overdue");
      });
      test("banner: snooze hides until tomorrow, then the next kind shows", () => {
        const h = hire("Engineering", OB.addDays(T, 3));
        const b = OB.pickBanner(h, T, {});
        const r = { hide: { [b.kindKey]: OB.addDays(T, 1) } };
        eq(OB.pickBanner(h, T, r).kind, "overdue");
        eq(OB.pickBanner(h, OB.addDays(T, 1), r).kind, "day1");
      });
      test("milestone: finishing your own Before Day 1 tasks, shown once", () => {
        const h = hire("Engineering", OB.addDays(T, 5));
        h.tasks.forEach((t) => { if (t.owner === "newhire" && t.phase === "before") t.done = true; });
        const m = OB.milestoneFor(h, T);
        eq(m.id, "phase-before"); ok(/^Before Day 1: done\./.test(m.title));
        const k = `${h.id}:milestone:phase-before`;
        eq(OB.pickBanner(h, T, { seen: { [k]: T } }).kind, "milestone", "still showing the day it first appeared");
        eq(OB.pickBanner(h, OB.addDays(T, 1), { seen: { [k]: T } }), null, "not again the next day");
      });

      // ---- Editable templates (U3) ----
      test("templates: no saved edits = defaults, and old/corrupt state falls back", () => {
        eq(OB.mergeTemplates(OB.TEMPLATES, undefined), OB.TEMPLATES);
        eq(OB.mergeTemplates(OB.TEMPLATES, { Company: "oops", Sales: [{ nope: 1 }] }).Company, OB.TEMPLATES.Company);
        eq(OB.mergeTemplates(OB.TEMPLATES, { Sales: [{ nope: 1 }] }).Sales, [], "a saved (even empty) copy wins over the default");
      });
      test("templates: edited templates feed buildPlan and the add-hire preview", () => {
        const added = OB.makeTemplateTask({ title: "Meet the platform team", owner: "newhire", dayOffset: 5, isEvent: true }, "u-test");
        const tpl = OB.mergeTemplates(OB.TEMPLATES, { Engineering: [...OB.TEMPLATES.Engineering, added] });
        const p = OB.buildPlan("Engineering", T, [], null, tpl);
        const t = p.find((x) => x.key === "u-test");
        ok(t, "new task is in the plan");
        eq(t.dueDate, OB.addDays(T, 5)); eq(t.isEvent, true); eq(t.phase, "week1");
        ok(OB.templateTasksFor("Engineering", tpl).some((x) => x.key === "u-test"), "preview uses it too");
        ok(!OB.buildPlan("Engineering", T).some((x) => x.key === "u-test"), "defaults are unchanged");
      });
      test("templates: a removed task isn't in new plans", () => {
        const tpl = OB.mergeTemplates(OB.TEMPLATES, { Company: OB.TEMPLATES.Company.filter((t) => t.key !== "c-harass") });
        ok(!OB.buildPlan("Sales", T, [], null, tpl).some((t) => t.key === "c-harass"));
        ok(OB.buildPlan("Sales", T).some((t) => t.key === "c-harass"), "still in the default");
      });
      test("templates: existing hire's tasks are unaffected by later edits", () => {
        const h = hire("Engineering", T);
        const before = JSON.stringify(h.tasks);
        const saved = { Engineering: OB.mergeTemplates(OB.TEMPLATES, {}).Engineering.slice(1) };
        saved.Engineering[0].title = "Renamed";
        OB.buildPlan("Engineering", T, [], null, OB.mergeTemplates(OB.TEMPLATES, saved));
        eq(JSON.stringify(h.tasks), before);
        eq(OB.TEMPLATES.Engineering[1].title, "Set up your local dev environment", "defaults not mutated");
      });
      test("templates: validation", () => {
        const base = { title: "Read the wiki", owner: "newhire", dayOffset: 3 };
        ok(OB.validateTemplateTask(base, []).ok);
        ok(OB.validateTemplateTask({ ...base, title: "  " }, []).errors.title, "title required");
        ok(OB.validateTemplateTask({ ...base, title: "x".repeat(121) }, []).errors.title, "title ≤120");
        ok(OB.validateTemplateTask({ ...base, desc: "x".repeat(241) }, []).errors.desc, "desc ≤240");
        ok(OB.validateTemplateTask({ ...base, owner: "ceo" }, []).errors.owner, "owner");
        ok(OB.validateTemplateTask({ ...base, dayOffset: 28 }, []).errors.dayOffset, "after Day 28");
        ok(OB.validateTemplateTask({ ...base, dayOffset: -31 }, []).errors.dayOffset, "more than 30 days before");
        ok(OB.validateTemplateTask({ ...base, dayOffset: NaN }, []).errors.dayOffset, "not a number");
        ok(OB.validateTemplateTask({ ...base, dayOffset: 27 }, []).ok && OB.validateTemplateTask({ ...base, dayOffset: -30 }, []).ok, "edges ok");
        const dup = OB.validateTemplateTask({ ...base, title: "read the WIKI" }, [{ title: "Read the wiki" }]);
        ok(dup.ok && dup.warnings.length === 1, "duplicate title warns but doesn't block");
      });
      test("F9: 'day 0 of the job' is an error, not a silent '1 day before start'", () => {
        const base = { title: "Read the wiki", owner: "newhire" };
        const zero = OB.validateTemplateTask({ ...base, n: "0", mode: "day", dayOffset: OB.timingToOffset("0", "day") }, []);
        eq(zero.ok, false); eq(zero.errors.dayOffset, "Day 1 is the first day.");
        ok(OB.validateTemplateTask({ ...base, n: "0", mode: "before", dayOffset: OB.timingToOffset("0", "before") }, []).errors.dayOffset, "0 days before");
        ok(OB.validateTemplateTask({ ...base, n: "1", mode: "day", dayOffset: OB.timingToOffset("1", "day") }, []).ok, "Day 1 ok");
      });
      test("templates: timing picker converts to dayOffset and back", () => {
        eq(OB.timingToOffset("5", "before"), -5); eq(OB.timingToOffset(1, "day"), 0); eq(OB.timingToOffset(28, "day"), 27);
        ok(Number.isNaN(OB.timingToOffset("", "day"))); ok(Number.isNaN(OB.timingToOffset("2.5", "day")));
        eq(OB.offsetToTiming(-3), { n: 3, mode: "before" }); eq(OB.offsetToTiming(9), { n: 10, mode: "day" });
      });
      test("templates: new keys are unique, Edited marker, last-task rule", () => {
        const k1 = OB.newTemplateKey(OB.TEMPLATES), k2 = OB.newTemplateKey(OB.TEMPLATES);
        ok(k1 !== k2 && !Object.values(OB.TEMPLATES).flat().some((t) => t.key === k1));
        eq(OB.templateIsEdited(OB.TEMPLATES.Sales.slice().reverse(), OB.TEMPLATES.Sales), false, "order alone isn't an edit");
        eq(OB.templateIsEdited(OB.TEMPLATES.Sales.slice(1), OB.TEMPLATES.Sales), true);

      // ---------- Round 4, pass B: manager (js/manager.js) ----------
      // A seed hire built the way store.js builds it, for a given "today".
      function seedHire(id, today) {
        const s = OB.SEED_HIRES.find((x) => x.id === id);
        const startDate = OB.seedStartDate(s, today);
        const tasks = OB.buildPlan(s, startDate, s.skip);
        for (const t of tasks) if (s.doneKeys.includes(t.key)) Object.assign(t, { done: true, doneAt: t.dueDate < today ? t.dueDate : today });
        const h = { id: s.id, name: s.name, title: s.title, department: s.department, workType: s.workType, jobLevel: s.jobLevel, role: s.role || null, managerId: s.managerId, startDate, tasks };
        h.buddyId = s.buddyId || (s.doneKeys.includes("c-buddy") ? OB.defaultBuddyId(s.department) : null);
        h.learning = {};
        h.forms = OB.seedForms(h);
        return OB.seedManagerExtras(h, s, today);
      }

        const m2 = OB.complianceMatrix(hs.concat(cs));
        ok(m2.columns.some((c) => c.key === "r-cs-escalation"));
        eq(m2.rows.find((r) => r.hire.id === "emily").cells["r-cs-escalation"].state, "na");
        eq(OB.complianceMatrix([hs.find((h) => h.id === "aisha")]).headline, "1 of 1 person has everything signed");
        eq(OB.complianceMatrix([]).headline, "Nobody has an onboarding plan yet");
        eq(OB.bannedWords(m.headline + m.rows.map((r) => m.columns.map((c) => OB.cellWords(r.cells[c.key], c, r.hire)).join(" ")).join(" ")), []);
      });
      test("C2b audit trail: who completed it and when, acknowledged wording", () => {
        const hs = compHires();
        hs.find((h) => h.id === "marcus").tasks.find((t) => t.key === "c-handbook").done = true;
        Object.assign(hs.find((h) => h.id === "marcus").tasks.find((t) => t.key === "c-handbook"), { doneAt: "2026-11-03", doneBy: "marcus" });
        const m = OB.complianceMatrix(hs);
        const a = OB.auditTrail(m, "c-handbook", hs);
        eq(a.entries.map((e) => [e.hireName, e.at, e.verb, e.text]), [
          ["Marcus Johnson", "2026-11-03", "acknowledged", "Marcus Johnson acknowledged it"],
          ["Aisha Patel", "2026-10-23", "acknowledged", "Aisha Patel acknowledged it"],
        ], "newest first");
        eq(a.notYet.map((x) => x.hireName), ["Emily Chen", "Tom Rivera"]);
        const b = OB.auditTrail(m, "c-offer", hs);
        ok(b.entries.every((e) => e.verb === "completed"));
        const hrDone = OB.auditTrail({ columns: [m.columns[0]], rows: [{ hire: { id: "x", name: "Pat" }, cells: { "c-offer": { state: "done", doneAt: T, doneBy: "sarah" } } }] }, "c-offer", hs);
        eq(hrDone.entries[0].text, "Sarah Kim marked it done for Pat");
        eq(OB.whoName("nobody", hs), "Unknown");
        eq(OB.auditTrail(m, "nope", hs).column, null);
      });
      test("C2b CSV export: matrix + audit log, escaping, formula guard", () => {
        eq(OB.csvCell("plain"), "plain");
        eq(OB.csvCell("Rivera, Sam"), '"Rivera, Sam"');
        eq(OB.csvCell('Say "hi"'), '"Say ""hi"""');
        eq(OB.csvCell("two\nlines"), '"two\nlines"');
        eq(OB.csvCell("=SUM(A1)"), "'=SUM(A1)");
        eq(OB.csvCell("-1"), "'-1");
        eq(OB.csvCell(null), "");
        const hs = compHires();
        hs[0].name = "Chen, Emily";
        const m = OB.complianceMatrix(hs);
        const csv = OB.complianceCsv(m, hs);
        const lines = csv.split("\r\n");
        eq(lines[0], "Compliance matrix");
        eq(lines[1], "Person,Department,Manager,Sign offer letter and employment agreement,Complete I-9 and W-4 tax forms,Complete security awareness training,Read and acknowledge the employee handbook,Complete harassment prevention training");
        ok(lines.some((l) => l.startsWith('"Chen, Emily",Engineering,David Okafor,Done 2026-10-30,')), "quoted name, done date");
        ok(lines.includes("Audit log"));
        ok(lines.includes("Read and acknowledge the employee handbook,Aisha Patel,Acknowledged,Aisha Patel,2026-10-23"));
        ok(csv.endsWith("\r\n"));
        ok(OB.parseCsv(csv).length > 6, "it reads back with the CSV parser");
      });
      test("C2b doneBy: recorded by form submit, learning sync, buddy; migrated from the owner", () => {
        const h = hire("Engineering", "2026-11-09");
        h.id = "emily"; h.name = "Emily Chen"; h.forms = {}; h.learning = {};
        const offer = { legalName: "Emily Chen", signature: "Emily Chen", agree: true };
        const r = OB.submitForm(h, "offer", { ...offer }, T, "emily");
        ok(r.ok, "offer form submits");
        eq(h.tasks.find((t) => t.key === "c-offer").doneBy, "emily");
        const sec = OB.LEARNING.Company ? (OB.LEARNING.Company.find((x) => x.taskKey === "c-security") || {}).id : "l-security";
        OB.setLearningStatus(h, sec || "l-security", "done", T, "emily");
        eq(h.tasks.find((t) => t.key === "c-security").doneBy, "emily");
        OB.chooseBuddy(h, "nina", T);
        eq(h.tasks.find((t) => t.key === "c-buddy").doneBy, "david", "no byId: the manager");
        const old = { id: "o", managerId: "david", tasks: [
          { owner: "newhire", done: true }, { owner: "manager", done: true }, { owner: "it", done: true }, { owner: "hr", done: true, doneBy: "sarah" }, { owner: "newhire", done: false },
        ] };
        OB.migrateDoneBy(old);
        eq(old.tasks.map((t) => t.doneBy), ["o", "david", "sarah", "sarah", null]);
      });

      // C2c. Documents
      test("C2c documents: audience filtering and search", () => {
        const docs = OB.seedDocuments();
        ok(docs.length >= 10);
        const titles = (h) => OB.docsFor(h, docs).map((d) => d.title);
        const eng = titles({ department: "Engineering", jobLevel: "Individual contributor" });
        ok(eng.includes("Engineering handbook") && eng.includes("Employee handbook"));
        ok(!eng.includes("Sales playbook") && !eng.includes("Intern stipend and perks") && !eng.includes("Manager essentials guide"));
        ok(titles({ department: "Sales", jobLevel: "People manager" }).includes("Manager essentials guide"), "job level audience");
        ok(titles({ department: "Sales", jobLevel: "Intern" }).includes("Intern stipend and perks"));
        eq(OB.docsFor({ department: "Sales" }, docs)[0].category, "Policies", "sorted by category order");
        eq(OB.searchDocs(docs, "handbook", "all").map((d) => d.id), ["doc-handbook", "doc-eng"]);
        eq(OB.searchDocs(docs, "  HANDBOOK  engineering ", "all").map((d) => d.id), ["doc-eng"], "every word, any case");
        eq(OB.searchDocs(docs, "", "Benefits").length, 3);
        eq(OB.searchDocs(docs, "interns", "all").map((d) => d.id), ["doc-intern"], "audience words count");
        eq(OB.searchDocs(docs, "zzz", "all"), []);
        eq(OB.audienceLabel({ kind: "level", value: "People manager" }), "People managers");
        eq(OB.audienceLabel({ kind: "department", value: "Nowhere" }), "Everyone", "unknown audience = everyone");
        eq(OB.parseAudience("department:Sales"), { kind: "department", value: "Sales" });
        eq(OB.audienceValue({ kind: "level", value: "Intern" }), "level:Intern");
      });
      test("C2c documents: validation, add / edit", () => {
        const docs = OB.seedDocuments();
        const v = OB.validateDoc({ title: "", category: "", link: "intranet", audience: "x:y" }, docs);
        eq(Object.keys(v.errors).sort(), ["audience", "category", "link", "title"]);
        eq(OB.validateDoc({ title: "employee HANDBOOK", category: "Policies", link: "https://x.example.com", audience: "everyone" }, docs).errors.title, "There's already a document called employee HANDBOOK.");
        ok(OB.validateDoc({ title: "Employee handbook", category: "Policies", link: "https://x.example.com", audience: "everyone" }, docs, "doc-handbook").ok, "editing keeps its own title");
        const d = OB.makeDoc({ title: " Travel policy ", category: "Policies", desc: "", link: " https://intranet.example.com/travel ", audience: "department:Sales" }, T, docs);
        eq([d.title, d.link, d.audience, d.updated], ["Travel policy", "https://intranet.example.com/travel", { kind: "department", value: "Sales" }, T]);
        ok(!docs.some((x) => x.id === d.id));
        eq(OB.makeDoc({ title: "X", category: "Benefits", link: "https://a.example.com", audience: "everyone" }, T, docs, "doc-keep").id, "doc-keep");
        eq(OB.cleanDoc({ id: "bad id!", title: "x", category: "Policies", link: "https://a.example.com" }), null);
        eq(OB.cleanDoc({ id: "d1", title: "x", category: "Policies", link: "javascript:alert(1)" }), null);
      });
      test("C2c docId: link resolution, template flag and picker fields", () => {
        const docs = OB.seedDocuments();
        const p = OB.buildPlan("Engineering", T);
        const hb = p.find((t) => t.key === "c-handbook");
        eq(hb.docId, "doc-handbook");
        eq(OB.taskLinkFor(hb, docs).href, "https://intranet.example.com/handbook");
        const moved = docs.map((d) => (d.id === "doc-handbook" ? { ...d, link: "https://new.example.com/hb" } : d));
        eq(OB.taskLinkFor(hb, moved), { href: "https://new.example.com/hb", doc: moved[0] }, "the document's link wins");
        eq(OB.taskLinkFor({ ...hb, link: "https://own.example.com" }, []).href, "https://own.example.com", "document gone: the task's own link");
        eq(OB.taskLinkFor({ link: "javascript:x" }, docs), null);
        ok(p.find((t) => t.key === "c-security").required, "required flag reaches the plan");
        const base = { title: "Read the policy", owner: "newhire", dayOffset: 3, type: "read", docId: "doc-sales", required: true };
        ok(OB.validateTemplateTask(base, [], docs).ok);
        eq(OB.validateTemplateTask({ ...base, docId: "doc-gone" }, [], docs).errors.docId, "Pick a document from the list, or none.");
        const t = OB.makeTemplateTask(base, "k");
        eq([t.docId, t.required], ["doc-sales", true]);
        eq(OB.makeTemplateTask({ ...base, type: "watch" }, "k").docId, undefined, "only read / acknowledge tasks link a document");
        eq(OB.cleanTemplateTask({ key: "k", ...base }).docId, "doc-sales");
        eq(OB.cleanTemplateTask({ key: "k", ...base, required: "yes" }).required, undefined);
        eq(OB.templateIsEdited(OB.TEMPLATES.Company.map((x) => (x.key === "c-welcome" ? { ...x, required: true } : x)), OB.TEMPLATES.Company), true, "required counts as an edit");
        eq(OB.templateIsEdited(OB.TEMPLATES.Company.map((x) => (x.key === "c-handbook" ? { ...x, docId: undefined } : x)), OB.TEMPLATES.Company), true);
      });

      test("migration (pass C2): required / docId, doneBy, documents; old saves load", () => {
        const s = {
          version: 1, viewerId: "sarah", hrFilter: { dept: "Sales" },
          hires: [{ id: "o1", name: "Old One", department: "Sales", startDate: T, managerId: "priya", tasks: [
            { key: "c-handbook", title: "Read", owner: "newhire", done: true, doneAt: T },
            { key: "c-security", title: "Sec", owner: "newhire", done: false },
            { key: null, title: "Custom", owner: "manager", done: true, doneAt: T, docId: "bad id!" },
          ] }],
        };
        OB.migrateState(s);
        const h = s.hires[0];
        eq([h.tasks[0].docId, h.tasks[0].doneBy, h.tasks[1].required, h.tasks[1].doneBy, h.tasks[2].doneBy, h.tasks[2].docId], ["doc-handbook", "o1", true, null, "priya", undefined]);
        eq(s.documents.length, OB.DOCUMENTS.length);
        eq(s.hrFilter, undefined, "an old filter bar state is dropped");
        eq(h.kind, undefined, "no plan kinds (offboarding and moves were dropped)");
        const t = { version: 1, hires: [], documents: [{ id: "x" }, OB.DOCUMENTS[0]] };
        OB.migrateState(t);
        eq(t.documents.map((d) => d.id), ["doc-handbook"], "bad documents dropped");
      });

      test("F4 weekend start: Saturday / Sunday warn (not block) and suggest the Monday", () => {
        const sat = OB.validateHire({ ...good, startDate: "2026-11-14" }, T, []);

        eq(sat.weekend.label, "Use Mon, Nov 16");
        ok(sat.warnings.includes("Nov 14 is a Saturday. Most people start on a Monday: use Mon, Nov 16?"), sat.warnings.join(" | "));
        const sun = OB.validateHire({ ...good, startDate: "2026-11-15" }, T, []);
        eq([sun.weekend.day, sun.weekend.monday], ["Sunday", "2026-11-16"]);
        eq(OB.weekendStart("2026-12-27").monday, "2026-12-28");
        eq(OB.weekendStart("2027-01-02").text, "Jan 2 is a Saturday. Most people start on a Monday: use Mon, Jan 4?", "across the year end");
      });
      test("F4 weekday start: no weekend warning", () => {
        for (const d of ["2026-11-16", "2026-11-17", "2026-11-18", "2026-11-19", "2026-11-20"]) {
          const r = OB.validateHire({ ...good, startDate: d }, T, []);

          ok(!r.warnings.some((w) => /Saturday|Sunday/.test(w)), d);

      });

      test("seed completion dates never show after the demo today", () => {
        eq(OB.shownDoneAt("2026-11-06", "2026-11-05"), "2026-11-05");
        eq(OB.shownDoneAt("2026-11-04", "2026-11-05"), "2026-11-04");
        eq(OB.shownDoneAt(null, "2026-11-05"), null);
        eq(OB.shownDoneAt("2026-11-06"), "2026-11-06", "no today: unchanged");
        const h = hire("Sales", OB.addDays(T, -10));
        const t = h.tasks.find((x) => OB.isComplianceTask(x));
        Object.assign(t, { done: true, doneAt: "2026-11-06", doneBy: h.id });

      const out = document.getElementById("out");
      out.innerHTML = results.map(([n, p]) => `<li class="${p ? "pass" : "fail"}">${p ? "✓" : "✗"} ${n.replace(/</g, "&lt;")}</li>`).join("");
      const failed = results.filter((r) => !r[1]).length;
      document.getElementById("summary").innerHTML = failed
        ? `<span class="fail">${failed} of ${results.length} failed</span>`
        : `<span class="pass">All ${results.length} tests passed</span>`;
      document.title = failed ? `FAIL (${failed})` : `PASS (${results.length})`;
